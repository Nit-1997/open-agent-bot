# Open Agent on this computer: `docker compose up -d --build`, then open http://127.0.0.1:3000. The hosted stack is compose.hosted.yml.
name: open-agent

services:
  search:
    image: ${OPEN_AGENT_SEARCH_IMAGE:-open-agent-search:local}
    build:
      context: local/searxng
    volumes:
      - searxng-secret:/var/lib/searxng-secret
    tmpfs:
      - /etc/searxng:size=4m
      - /var/cache/searxng:size=64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  agent:
    image: ${OPEN_AGENT_IMAGE:-open-agent:local}
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    command: ["node", "dist/local/main.js"]
    environment:
      OPEN_AGENT_PORT: ${OPEN_AGENT_PORT:-3000}
      OPEN_AGENT_RESET_CREDENTIALS: ${OPEN_AGENT_RESET_CREDENTIALS:-}
      OPEN_AGENT_LAUNCH_TOKEN: ${OPEN_AGENT_LAUNCH_TOKEN:-}
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${OPEN_AGENT_PORT:-3000}:3000"
    volumes:
      - data:/data
      - keys:/keys
      - renderer-key:/run/open-agent/renderer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/pwuser:size=128m,uid=1001,gid=1001,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [default, render]
    depends_on:
      search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: on-failure:3

  renderer:
    image: ${OPEN_AGENT_IMAGE:-open-agent:local}
    pull_policy: never
    command: ["node", "dist/renderer/main.js"]
    environment:
      RENDERER_SECRET_FILE: /run/open-agent/renderer/secret
    volumes:
      - renderer-key:/run/open-agent/renderer:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/pwuser:size=128m,uid=1001,gid=1001,mode=0700
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt: ["no-new-privileges:true", "seccomp=local/renderer/seccomp.json"]
    networks: [render, render-egress]
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

networks:
  render:
    internal: true
  render-egress: {}

volumes:
  data:
    name: ${OPEN_AGENT_DATA_VOLUME:-open-agent-data}
  keys:
    name: ${OPEN_AGENT_KEYS_VOLUME:-open-agent-keys}
  renderer-key: {}
  searxng-secret: {}
