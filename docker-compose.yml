services:
  llm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: deploy-config/.env-llm
    volumes:
      - ./deploy-config/litellm/config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  search:
    image: searxng/searxng:latest
    env_file: deploy-config/.env-search
    volumes:
      - ./deploy-config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: deploy-config/.env-agent
    volumes:
      - artifacts-data:/data/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - llm
      - search
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: deploy-config/.env-nextjs
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - agent
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  artifacts-data:
  ollama-data:
