services:
  llm:
    # LiteLLM 1.106.5, pinned so restarts don't pull a different proxy
    image: ghcr.io/berriai/litellm:main-stable@sha256:7d6ae6c8d73d1b6aea4cb75d07c4a8a953f0809b0764522b8eab693734c5e905
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: deploy-config/.env-llm
    volumes:
      - ./deploy-config/litellm/config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  search:
    # pinned so restarts don't pull a different SearXNG
    image: searxng/searxng:latest@sha256:0f48ffe2152f388f5eaede27f96b610449cebfc890d0ad457304475a54ad7b6e
    env_file: deploy-config/.env-search
    volumes:
      - ./deploy-config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: deploy-config/.env-agent
    environment:
      AGENT_MODEL: ${AGENT_MODEL:-chat-default}
      PI_OAUTH_CALLBACK_HOST: 0.0.0.0
    volumes:
      - artifacts-data:/data/artifacts
      - agent-data:/data/agent
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:1455:1455"
    depends_on:
      - llm
      - search
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: deploy-config/.env-nextjs
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.12
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  artifacts-data:
  agent-data:
  ollama-data:
