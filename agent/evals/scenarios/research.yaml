id: research
proves: [M2, M8]
context: { timeZone: America/Los_Angeles, locale: en-US, home: "Palo Alto, CA" }
turns:
  - prompt: "Heat pump vs furnace for a 1,800 sq ft house in Palo Alto: which should I choose? Write me a report with costs, efficiency and incentives."
assert:
  - { type: must_call, tool: create_artifact }
  - { type: max_tool_calls, n: 24 }
  - { type: max_unverified_claims, n: 5 }
  - type: banned_phrases
    patterns:
      - "\\bI(?:'ve| have)? (?:booked|purchased|ordered|checked out|reserved)\\b"
      - "added (?:it |them |these )?to (?:your )?cart on"
      - "your (?:order|booking|reservation) (?:is|has been) (?:confirmed|placed|complete)"
      - "(?:booked|reserved|ordered) (?:it |this |that )?(?:through|via|with) (?:our|my) "
  - { type: max_duration_s, n: 420 }
future_assert:
  - { type: tool_arg_matches, tool: load_skill, pattern: "research" }
