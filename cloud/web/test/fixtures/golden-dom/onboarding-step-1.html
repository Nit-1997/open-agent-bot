<div class="flex min-h-dvh w-full items-center justify-center px-4 py-4" id="onboarding">
  <div class="glass w-full max-w-[640px] rounded-[28px] p-2" id="onboarding-frame">
    <div class="w-full animate-rise rounded-[22px] border border-border bg-bg p-5 sm:px-7 sm:py-6" id="onboarding-card">
      <div class="flex items-center justify-between" id="onboarding-top">
        <span id="onboarding-orb-spacer">
        </span>
        <span class="eyebrow" id="onboarding-step">
          #text "01 / 06 · Your agent"
        </span>
      </div>
      <div class="mt-3" id="onboarding-body">
        <div class="flex flex-col gap-6" id="agent-section-onboarding">
          <div class="flex flex-col items-center gap-3 py-1 text-center" id="agent-section-onboarding-hero">
            <span aria-hidden="true" class="orb inline-block shrink-0 h-28 w-28 orb-glow animate-breathe " data-look="mist" id="agent-section-onboarding-orb">
            </span>
            <h1 class="font-display text-[34px] leading-[1.1] text-text-primary" id="agent-section-onboarding-title">
              #text "Hi, I'm "
              <em id="agent-section-onboarding-title-name">
                <bdi id="agent-section-onboarding-title-bdi">
                  #text "Juno"
                </bdi>
              </em>
              #text "."
            </h1>
            <p class="max-w-[420px] text-[14px] leading-relaxed text-text-muted" id="agent-section-onboarding-sub">
              #text "I'll research, compare and plan for you. Give me a name and a look you'll recognise."
            </p>
          </div>
          <div class="flex flex-col gap-2" id="agent-section-onboarding-name">
            <label class="eyebrow text-text-muted" for="agent-section-onboarding-name-input" id="agent-section-onboarding-name-label">
              <span class="sr-only" id="agent-section-onboarding-name-label-prefix">
                #text "Agent "
              </span>
              #text "Name"
            </label>
            <input aria-invalid="false" autocomplete="off" class="h-12 rounded-[14px] border border-border bg-surface px-4 text-[16px] text-text-primary outline-none transition focus:border-mist-500 aria-invalid:border-danger-fg" id="agent-section-onboarding-name-input" maxlength="40" spellcheck="false" type="text" value="Juno">
            <div aria-label="Suggested agent names" class="flex flex-wrap gap-2" id="agent-section-onboarding-name-suggestions" role="group">
              <button class="rounded-full border border-border bg-surface px-3 py-1.5 text-[13px] text-text-secondary transition hover:border-border-strong hover:text-text-primary" id="agent-section-onboarding-name-suggestion-atlas" type="button">
                #text "Atlas"
              </button>
              <button class="rounded-full border border-border bg-surface px-3 py-1.5 text-[13px] text-text-secondary transition hover:border-border-strong hover:text-text-primary" id="agent-section-onboarding-name-suggestion-ivy" type="button">
                #text "Ivy"
              </button>
              <button class="rounded-full border border-border bg-surface px-3 py-1.5 text-[13px] text-text-secondary transition hover:border-border-strong hover:text-text-primary" id="agent-section-onboarding-name-suggestion-milo" type="button">
                #text "Milo"
              </button>
              <button class="rounded-full border border-border bg-surface px-3 py-1.5 text-[13px] text-text-secondary transition hover:border-border-strong hover:text-text-primary" id="agent-section-onboarding-name-suggestion-sage" type="button">
                #text "Sage"
              </button>
            </div>
          </div>
          <fieldset class="flex flex-col gap-2" id="agent-section-onboarding-look">
            <legend class="eyebrow mb-2 text-text-muted" id="agent-section-onboarding-look-legend">
              #text "Look"
            </legend>
            <div class="flex gap-3.5" id="agent-section-onboarding-look-options">
              <button aria-label="Mist" aria-pressed="true" class="orb h-11 w-11 border-2 transition border-text-primary" data-look="mist" id="agent-section-onboarding-look-mist" title="Mist" type="button">
              </button>
              <button aria-label="Ember" aria-pressed="false" class="orb h-11 w-11 border-2 transition border-transparent hover:border-border-strong" data-look="ember" id="agent-section-onboarding-look-ember" title="Ember" type="button">
              </button>
              <button aria-label="Moss" aria-pressed="false" class="orb h-11 w-11 border-2 transition border-transparent hover:border-border-strong" data-look="moss" id="agent-section-onboarding-look-moss" title="Moss" type="button">
              </button>
              <button aria-label="Dusk" aria-pressed="false" class="orb h-11 w-11 border-2 transition border-transparent hover:border-border-strong" data-look="dusk" id="agent-section-onboarding-look-dusk" title="Dusk" type="button">
              </button>
            </div>
          </fieldset>
          <fieldset aria-describedby="agent-section-onboarding-tone-hint" class="flex flex-col gap-2" id="agent-section-onboarding-tone">
            <legend class="eyebrow mb-2 text-text-muted" id="agent-section-onboarding-tone-legend">
              #text "How "
              <bdi id="agent-section-onboarding-tone-legend-name">
                #text "Juno"
              </bdi>
              #text " talks"
            </legend>
            <div class="grid grid-cols-3 gap-2" id="agent-section-onboarding-tone-options">
              <button aria-pressed="false" class="rounded-xl border px-2 py-2.5 text-[13px] transition border-border bg-surface text-text-secondary hover:border-border-strong" id="agent-section-onboarding-tone-brief" type="button">
                #text "Brief"
              </button>
              <button aria-pressed="true" class="rounded-xl border px-2 py-2.5 text-[13px] transition border-charcoal bg-charcoal font-medium text-on-charcoal" id="agent-section-onboarding-tone-warm" type="button">
                #text "Warm"
              </button>
              <button aria-pressed="false" class="rounded-xl border px-2 py-2.5 text-[13px] transition border-border bg-surface text-text-secondary hover:border-border-strong" id="agent-section-onboarding-tone-thorough" type="button">
                #text "Thorough"
              </button>
            </div>
            <p class="text-[13px] text-text-muted" id="agent-section-onboarding-tone-hint">
              #text "Friendly and personal, still concise."
            </p>
          </fieldset>
        </div>
      </div>
      <div class="mt-4 flex gap-1.5" id="onboarding-progress">
        <button aria-current="step" aria-label="Go to agent" class="h-1 flex-1 rounded-full transition bg-charcoal" id="onboarding-progress-agent" type="button">
        </button>
        <button aria-label="Go to you" class="h-1 flex-1 rounded-full transition bg-surface-accent" id="onboarding-progress-you" type="button">
        </button>
        <button aria-label="Go to travel" class="h-1 flex-1 rounded-full transition bg-surface-accent" id="onboarding-progress-travel" type="button">
        </button>
        <button aria-label="Go to shopping" class="h-1 flex-1 rounded-full transition bg-surface-accent" id="onboarding-progress-shopping" type="button">
        </button>
        <button aria-label="Go to model" class="h-1 flex-1 rounded-full transition bg-surface-accent" id="onboarding-progress-model" type="button">
        </button>
        <button aria-label="Go to summary" class="h-1 flex-1 rounded-full transition bg-surface-accent" id="onboarding-progress-summary" type="button">
        </button>
      </div>
      <div class="mt-4 flex items-center justify-between gap-3" id="onboarding-actions">
        <button class="text-sm text-text-muted transition hover:text-text-primary" id="onboarding-skip" type="button">
          #text "Skip for now"
        </button>
        <div class="flex gap-2" id="onboarding-nav">
          <button class="rounded-full bg-charcoal px-5 py-2 text-sm font-medium text-on-charcoal transition hover:opacity-85 disabled:opacity-40" id="onboarding-next" type="button">
            #text "Next: about you"
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
