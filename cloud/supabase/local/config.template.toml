project_id = "{{PROJECT_ID}}"

[api]
enabled = true
port = {{API_PORT}}
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
external_url = "{{API_URL}}"

[api.tls]
enabled = false

[db]
port = {{DB_PORT}}
shadow_port = {{SHADOW_PORT}}
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = {{SPARE_PORT}}

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false
port = {{SPARE_PORT}}

[local_smtp]
enabled = true
port = {{MAIL_PORT}}

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = false

[auth]
enabled = true
site_url = "{{SITE_URL}}"
additional_redirect_urls = ["{{SITE_URL}}/auth/confirm", "{{SITE_URL}}/auth/callback"]
jwt_expiry = 900
jwt_issuer = "{{API_URL}}/auth/v1"
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6

[auth.rate_limit]
email_sent = 1000
token_refresh = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/before_user_created"

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/custom_access_token"

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = {{SPARE_PORT}}
backend = "postgres"
