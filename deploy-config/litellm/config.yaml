# Ollama is reached through its OpenAI-compatible /v1 endpoint with LiteLLM's openai/ provider.
# LiteLLM's ollama_chat/ adapter streams parallel tool calls all at index 0, which clients merge into one invalid call.
model_list:
  - model_name: chat-default
    litellm_params:
      model: os.environ/OLLAMA_CHAT_MODEL
      api_base: os.environ/OLLAMA_OPENAI_BASE_URL
      api_key: ollama
      reasoning_effort: none
  - model_name: chat-qwen3.5-35b
    litellm_params:
      model: openai/qwen3.5:35b
      api_base: os.environ/OLLAMA_OPENAI_BASE_URL
      api_key: ollama
      reasoning_effort: none
  - model_name: chat-gemma4
    litellm_params:
      model: openai/gemma4:latest
      api_base: os.environ/OLLAMA_OPENAI_BASE_URL
      api_key: ollama

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
