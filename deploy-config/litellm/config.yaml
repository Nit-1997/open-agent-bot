model_list:
  - model_name: chat-default
    litellm_params:
      model: os.environ/OLLAMA_CHAT_MODEL
      api_base: os.environ/OLLAMA_BASE_URL
      think: false
  - model_name: chat-gemma4
    litellm_params:
      model: ollama_chat/gemma4:latest
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: chat-qwen2.5-32b
    litellm_params:
      model: ollama_chat/qwen2.5:32b
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: chat-qwen3.5-35b
    litellm_params:
      model: ollama_chat/qwen3.5:35b
      api_base: os.environ/OLLAMA_BASE_URL
      think: false

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
