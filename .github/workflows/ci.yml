name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          COPILOTKIT_TELEMETRY_DISABLED: "true"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose starts from a fresh clone with no env files
        run: |
          ls deploy-config/.env-* 2>/dev/null && exit 1
          touch deploy-config/.env-agent deploy-config/.env-renderer deploy-config/.env-nextjs
          docker compose config --quiet
          docker compose --profile litellm --profile ollama config --quiet
          sh deploy-config/searxng/entrypoint.sh true
        env:
          SEARXNG_SECRET_FILE: /tmp/searxng-secret/secret
