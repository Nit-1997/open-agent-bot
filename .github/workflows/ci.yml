name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint -w @oab/core -w @oab/shared
      - run: npm run format:check -w @oab/core -w @oab/shared
      - run: npm run typecheck -w @oab/core
      - run: npm test -w @oab/core
      - run: npm run build -w @oab/core

  cloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint -w @oab/cloud-agent -w @oab/cloud-web -w @oab/cloud-e2e -w @oab/cloud-deploy
      - run: npm run lint:boundary && npm run lint:scripts && npm run format:check:scripts
      - run: npm run format:check -w @oab/cloud-agent -w @oab/cloud-web -w @oab/cloud-e2e -w @oab/cloud-deploy
      - run: npm run typecheck -w @oab/cloud-agent -w @oab/cloud-web -w @oab/cloud-e2e
      - run: npm test -w @oab/cloud-agent -w @oab/cloud-web -w @oab/cloud-e2e -w @oab/cloud-deploy
      - run: npm run build -w @oab/cloud-agent -w @oab/cloud-web
        env:
          COPILOTKIT_TELEMETRY_DISABLED: "true"

  cloud-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.111.0
      - run: npm ci
      - name: Start the oab-m7-ci local Supabase stack (127.0.0.1:18740-18744)
        run: node cloud/supabase/scripts/local-stack.mjs start --name oab-m7-ci --ports 18740
      - name: Local integration tests
        run: |
          stack_env=$(node cloud/supabase/scripts/local-stack.mjs env --name oab-m7-ci)
          eval "$stack_env"
          : "${OAB_SB_API_URL:?the local stack env is missing}"
          npm run test:local -w @oab/cloud-agent
      - name: Show the stack's containers and auth, db and kong logs (key lines dropped)
        if: failure()
        run: |
          docker ps -a --filter name=_oab-m7-ci --format '{{.Names}}\t{{.Status}}'
          for svc in auth db kong; do
            echo "::group::supabase_${svc}_oab-m7-ci"
            docker logs --tail 200 "supabase_${svc}_oab-m7-ci" 2>&1 | grep -viE 'sb_secret_|sb_publishable_|eyJ|apikey|authorization|password' || true
            echo "::endgroup::"
          done
      - name: Stop the stack and remove its volumes
        if: always()
        run: node cloud/supabase/scripts/local-stack.mjs stop --name oab-m7-ci --ports 18740

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Both stacks resolve from a fresh clone; the local one needs no env files
        run: |
          ls cloud/deploy/.env-* 2>/dev/null && exit 1
          docker compose --env-file /dev/null config --quiet
          touch cloud/deploy/.env-agent cloud/deploy/.env-renderer cloud/deploy/.env-nextjs
          docker compose -f cloud/deploy/compose.hosted.yml config --quiet
          docker compose -f cloud/deploy/compose.hosted.yml --profile litellm --profile ollama config --quiet
          sh cloud/deploy/searxng/entrypoint.sh true
        env:
          SEARXNG_SECRET_FILE: /tmp/searxng-secret/secret
      - name: Project names are pinned; the preview override is named and bound to 127.0.0.1
        run: |
          test "$(docker compose --env-file /dev/null config --format json | jq -r .name)" = open-agent
          test "$(docker compose --env-file /dev/null -f cloud/deploy/compose.hosted.yml config --format json | jq -r .name)" = open-agent-bot
          preview="docker compose --env-file /dev/null --profile local -f cloud/deploy/compose.hosted.yml -f cloud/deploy/compose.preview.yml config --format json"
          test "$($preview | jq -r .name)" = oab-preview
          test "$($preview | jq '[.services[].ports[]? | .host_ip] | all(. == "127.0.0.1")')" = true
          test "$($preview | jq '[.services[].ports[]? | .published | tonumber] | all(. >= 18000)')" = true
          test "$($preview | jq -c '[.services[].ports[]? | .published] | sort')" = '["18300","18800"]'
      - name: Local stack is loopback-only, takes no env files, keeps its volume names and has no bind mounts
        run: |
          local="docker compose --env-file /dev/null config --format json"
          test "$($local | jq '[.services[].ports[]? | .host_ip] | all(. == "127.0.0.1")')" = true
          test "$(docker compose --env-file /dev/null config --format json --no-env-resolution | jq '[.services[] | select(has("env_file"))] | length')" = 0
          test "$($local | jq -r '.volumes.data.name')" = open-agent-data
          test "$($local | jq -r '.volumes.keys.name')" = open-agent-keys
          test "$($local | jq '[.services[].volumes[]? | select(.type == "bind")] | length')" = 0
      - name: Local compose layout and preflight
        run: node --test scripts/test/composeLayout.test.mjs scripts/test/preflight.test.mjs
      - name: Hosted deploy checks (config equivalence with the pre-M6 baseline fixture, preview, preflight, twins, migrations, docs, env-files helper)
        run: npm test -w @oab/cloud-deploy
      - name: actionlint on every workflow (pinned image)
        run: npm run lint:workflows

  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TMPDIR: /home/runner/oab-tmp
      OAB_STANDALONE_ALLOW_DELETE: "1"
      OAB_STANDALONE_PROJECT: oab-ci-oss
      OPEN_AGENT_PORT: "18331"
      APP_ORIGIN: http://127.0.0.1:18331
      OPEN_AGENT_DATA_VOLUME: oab-ci-oss-data
      OPEN_AGENT_KEYS_VOLUME: oab-ci-oss-keys
      OPEN_AGENT_IMAGE: oab-ci-oss-agent:dev
      OPEN_AGENT_SEARCH_IMAGE: oab-ci-oss-search:dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: A private 0700 temp dir, as the desktop jobs use
        run: mkdir -m 700 "$TMPDIR"
      - name: Remove cloud/, then install, lint, type-check, test and build the rest; build and start the local stack; build the Mac app
        run: bash scripts/ci/standalone.sh --docker --hosted-free

  local-stack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      COMPOSE_PROJECT: oab-ci-local
      OPEN_AGENT_PORT: "18330"
      OPEN_AGENT_DATA_VOLUME: oab-ci-local-data
      OPEN_AGENT_KEYS_VOLUME: oab-ci-local-keys
      APP_ORIGIN: http://127.0.0.1:18330
      STUB_HOST: host.docker.internal
      STUB_PORT: "18341"
      STUB_BIND: 0.0.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the local images
        run: docker compose -p "$COMPOSE_PROJECT" --env-file /dev/null build
      - name: Start the local stack
        run: docker compose -p "$COMPOSE_PROJECT" --env-file /dev/null up -d --wait --wait-timeout 300
      - name: Start the stub model and reach it from the agent through host.docker.internal
        run: |
          nohup npx tsx e2e/support/stubModel.ts > "$RUNNER_TEMP/stub.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/stub.pid"
          for _ in $(seq 1 30); do grep -q "listening" "$RUNNER_TEMP/stub.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/stub.log"
          docker compose -p "$COMPOSE_PROJECT" --env-file /dev/null exec -T agent node -e "fetch('http://$STUB_HOST:$STUB_PORT/v1/models').then(r=>{console.log('stub via host-gateway:',r.status);process.exit(r.ok?0:1)},e=>{console.log('stub unreachable:',e.cause?.code??e.message);process.exit(1)})"
      - name: Local e2e subset on the stub model
        run: npm run local -w e2e
      - name: Refusal probes (Host, Origin, fetch metadata, no CORS)
        run: npx tsx e2e/scripts/local-probes.mts
      - name: Restart the stack; data and keys survive down and up
        run: |
          docker compose -p "$COMPOSE_PROJECT" --env-file /dev/null down
          docker volume inspect "$OPEN_AGENT_DATA_VOLUME" "$OPEN_AGENT_KEYS_VOLUME" --format '{{.Name}} kept'
          docker compose -p "$COMPOSE_PROJECT" --env-file /dev/null up -d --wait --wait-timeout 300
      - name: After-restart spec
        run: npm run local:after-restart -w e2e
      - name: Stack status and agent request log
        if: failure()
        run: |
          docker compose -p "$COMPOSE_PROJECT" --env-file /dev/null ps -a
          docker compose -p "$COMPOSE_PROJECT" --env-file /dev/null logs --no-color --tail 200 agent renderer search
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: local-stack-e2e
          path: e2e/test-results
          retention-days: 7
      - name: Tear down the stack, its volumes and the stub
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/stub.pid" ]; then kill "$(cat "$RUNNER_TEMP/stub.pid")" 2>/dev/null || true; fi
          docker compose -p "$COMPOSE_PROJECT" --env-file /dev/null down -v
          docker volume rm "$OPEN_AGENT_DATA_VOLUME" "$OPEN_AGENT_KEYS_VOLUME" 2>/dev/null || true

  sqlite-node24:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: SQLite store and local entry tests on Node 24, as pwuser, with npm ci inside the container
        run: |
          docker run --rm --user pwuser -v "$PWD":/src:ro \
            -e ELECTRON_SKIP_BINARY_DOWNLOAD=1 -e COPILOTKIT_TELEMETRY_DISABLED=true \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea sh -ec '
              mkdir -p /tmp/repo && cd /src && tar --exclude=./node_modules --exclude="./*/node_modules" --exclude="./*/*/node_modules" --exclude=./.git --exclude=./.factory -cf - . | tar -C /tmp/repo -xf -
              cd /tmp/repo && node --version && case "$(node -p process.versions.node)" in 24.*) ;; *) echo "Node 24 required, got $(node -p process.versions.node)" >&2; exit 1 ;; esac
              npm ci -w @oab/core -w @oab/shared -w @oab/bff --include-workspace-root
              cd packages/core && npx vitest run test/local test/store'

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TMPDIR: /home/runner/oab-tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: A private temp dir (the shell refuses a docker CLI under a world-writable parent such as /tmp)
        run: mkdir -m 700 "$TMPDIR"
      - run: npm ci
      - name: Electron's system libraries, xvfb, and unprivileged user namespaces for Chromium's sandbox
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run electron:install -w @oab/desktop
      - run: npm run lint -w @oab/desktop
      - run: npm run format:check -w @oab/desktop
      - run: npm run typecheck -w @oab/desktop
      - run: npm test -w @oab/desktop
      - run: npm run build -w @oab/desktop && npm run stage -w @oab/desktop
      - name: Electron e2e with the fake docker CLI (no Docker)
        working-directory: e2e
        run: xvfb-run -a npx playwright test -c playwright.desktop.config.ts --project desktop-fake
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: desktop-fake-e2e
          path: e2e/test-results/desktop
          retention-days: 7

  desktop-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TMPDIR: /home/runner/oab-tmp
      DESKTOP_REAL_DOCKER: "1"
      DESKTOP_REAL_DOCKER_CLI: /usr/bin/docker
      DESKTOP_REAL_ENGINE: Docker
      DESKTOP_REAL_PROJECT: oab-ci-desktop
      DESKTOP_REAL_RANGE: 18350-18359
      DESKTOP_REAL_AGENT_IMAGE: oab-ci-agent:dev
      DESKTOP_LOCAL_PREFIX: oab-ci-
      OPEN_AGENT_SHELL_ALLOW_SYSTEM_SOCKET: "1"
      STUB_HOST: host.docker.internal
      STUB_PORT: "18341"
      STUB_BIND: 0.0.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: A private temp dir (the shell refuses a docker CLI under a world-writable parent such as /tmp)
        run: mkdir -m 700 "$TMPDIR"
      - run: npm ci
      - name: Electron's system libraries, xvfb, and unprivileged user namespaces for Chromium's sandbox
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run electron:install -w @oab/desktop
      - run: npm run build -w @oab/desktop && npm run stage -w @oab/desktop
      - name: Build the two local images (plain docker build; no compose project is created)
        run: |
          docker build -f packages/core/Dockerfile --build-arg OPEN_AGENT_VERSION=0.0.0-ci -t oab-ci-agent:dev .
          docker build --build-arg OPEN_AGENT_VERSION=0.0.0-ci -t oab-ci-search:dev local/searxng
      - name: Write the dev services file (local tags, no pull)
        run: |
          file="$RUNNER_TEMP/dev-services.json"
          node -e '
            const { createHash } = require("node:crypto");
            const sha = createHash("sha256").update(require("node:fs").readFileSync("docker-compose.yml")).digest("hex");
            const lock = { schema: 1, kind: "dev", version: "0.0.0-ci", composeSha256: sha, images: { agent: "oab-ci-agent:dev", search: "oab-ci-search:dev" }, pull: false };
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(lock, null, 2));
          ' "$file"
          cat "$file"
          echo "DESKTOP_REAL_SERVICES=$file" >> "$GITHUB_ENV"
      - name: The stub model is reachable from a container through host.docker.internal (the specs start their own on the same port)
        run: |
          setsid nohup npx tsx e2e/support/stubModel.ts > "$RUNNER_TEMP/stub.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do grep -q "listening" "$RUNNER_TEMP/stub.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/stub.log"
          rc=0
          docker run --rm --add-host host.docker.internal:host-gateway --entrypoint node oab-ci-agent:dev -e "fetch('http://$STUB_HOST:$STUB_PORT/v1/models').then(r=>{console.log('stub via host-gateway:',r.status);process.exit(r.ok?0:1)},e=>{console.log('stub unreachable:',e.cause?.code??e.message);process.exit(1)})" || rc=$?
          kill -- -"$pid"
          for _ in $(seq 1 10); do (exec 3<>"/dev/tcp/127.0.0.1/$STUB_PORT") 2>/dev/null || break; sleep 1; done
          exit "$rc"
      - name: Electron e2e against real Docker (lifecycle, smoke with the stub, Services & data, local build)
        working-directory: e2e
        run: xvfb-run -a npx playwright test -c playwright.desktop.config.ts --project desktop-real
        env:
          DESKTOP_REAL_EVIDENCE: ${{ github.workspace }}/e2e/test-results/desktop/evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: desktop-real-e2e
          path: e2e/test-results/desktop
          retention-days: 7
      - name: Tear down every oab-ci-desktop project and its volumes
        if: always()
        run: |
          for p in oab-ci-desktop oab-ci-desktop-lb; do
            OPEN_AGENT_DATA_VOLUME=$p-data OPEN_AGENT_KEYS_VOLUME=$p-keys OPEN_AGENT_PORT=18350 \
              docker compose -p "$p" -f docker-compose.yml --env-file /dev/null down -v --remove-orphans
            docker volume rm "$p-data" "$p-keys" 2>/dev/null || true
          done

  desktop-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        name: Package the Mac app only on main, or when the shell, the bundled stack files or this workflow change
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "desktop=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/desktop/|docker-compose\.yml$|local/renderer/seccomp\.json$|\.github/workflows/ci\.yml$)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  desktop-package:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run electron:install -w @oab/desktop
      - name: Rosetta for the x64 smoke
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Both DMGs, ad-hoc signed, fuses flipped
        run: npm run dist -w @oab/desktop -- --arm64 --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Packaged smoke on both apps (fuses, plist, lipo, codesign, stack hashes, sizes, then a test-mode launch with the fake docker CLI)
        run: |
          v=$(node -p 'require("./apps/desktop/package.json").version')
          node apps/desktop/scripts/packagedSmoke.mjs --app "apps/desktop/release/mac-arm64/Open Agent.app" --app "apps/desktop/release/mac/Open Agent.app" \
            --dmg "apps/desktop/release/Open-Agent-$v-arm64.dmg" --dmg "apps/desktop/release/Open-Agent-$v-x64.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-agent-dmgs
          path: apps/desktop/release/*.dmg
          retention-days: 7
