name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          COPILOTKIT_TELEMETRY_DISABLED: "true"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose starts from a fresh clone with no env files
        run: |
          ls deploy-config/.env-* 2>/dev/null && exit 1
          touch deploy-config/.env-agent deploy-config/.env-renderer deploy-config/.env-nextjs
          docker compose config --quiet
          docker compose --profile litellm --profile ollama config --quiet
          sh deploy-config/searxng/entrypoint.sh true
        env:
          SEARXNG_SECRET_FILE: /tmp/searxng-secret/secret
      - name: Root compose has no project name; preview override is named and bound to 127.0.0.1
        run: |
          if grep -qE '^name:' docker-compose.yml; then echo "docker-compose.yml must not set a project name"; exit 1; fi
          preview="docker compose --env-file /dev/null --profile local -f docker-compose.yml -f deploy-config/compose.preview.yml config --format json"
          test "$($preview | jq -r .name)" = oab-preview
          test "$($preview | jq '[.services[].ports[]? | .host_ip] | all(. == "127.0.0.1")')" = true
          test "$($preview | jq -c '[.services[].ports[]? | .published] | sort')" = '["18300","18800"]'
